<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--soft:#22304e;--text:#f5f7ff;--muted:#aeb9cf;--accent:#9f8ae8;--gold:#C9A227}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px 40px;background:radial-gradient(circle at top,#202b4b,var(--bg) 62%);color:var(--text);font-family:Arial,"Segoe UI",sans-serif}main{width:min(1000px,100%);margin:auto}h1{margin:8px 0;color:#60a5fa;font-size:clamp(1.5rem,4vw,2.2rem)}p{color:var(--muted);line-height:1.8}.card{overflow:hidden;border:1px solid #ffffff22;border-radius:20px;background:#151e33ee}.screen{position:relative;display:grid;place-items:center;aspect-ratio:16/10;min-height:320px;background:#050914}iframe{display:none;position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}.empty{padding:25px;color:var(--muted);text-align:center;line-height:1.8}.controls{display:flex;flex-wrap:wrap;gap:10px;padding:16px;border-top:1px solid #ffffff22}button,select,a{min-height:44px;padding:10px 15px;border:1px solid #ffffff22;border-radius:11px;background:var(--soft);color:var(--text);font:inherit;font-weight:bold;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#304269}.primary{background:#7660ca;border-color:transparent}.status{padding:0 16px 16px;color:var(--muted);line-height:1.6}input{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:620px){.controls>*{width:100%}}
  </style>
</head>
<body>
  <main>
    <header><h1>👁️ Preview Mode</h1><p>اختاري صفحة HTML لعرضها في الشاشة: من صفحات القالب، أو ملف من جهازك.</p></header>
    <section class="card">
      <div class="screen"><iframe id="htmlFrame" title="عرض HTML"></iframe><div id="emptyMessage" class="empty">🖥️<br><strong>اختاري صفحة HTML للعرض</strong></div></div>
      <div class="controls">
        <select id="pageSelect" aria-label="صفحات القالب">
          <option value="">— صفحات القالب —</option>
          <option value="01_clips/clip_💓.html">🎬 المقطع الأول</option>
          <option value="01_clips/clip_02.html">🎬 المقطع الثاني</option>
          <option value="02_assets/water_string_loops.html">🎵 الماء والوتر</option>
          <option value="03_export-tool/index.html">📤 أداة التصدير</option>
        </select>
        <button id="chooseHtml" class="primary" type="button">اختيار HTML من الجهاز</button>
        <button id="clearButton" type="button">مسح الشاشة</button>
        <a href="index.html" style="color:var(--gold);">← العودة</a>
        <input id="htmlInput" type="file" accept=".html,.htm,text/html">
      </div>
      <div id="status" class="status">جاهز.</div>
    </section>
  </main>
  <script src="preview.js"></script>
</body>
</html>
